syntax = "proto3";

package payment;

option java_multiple_files = true;
option java_package = "com.aleksandar.microbench.payment.grpc";
option java_outer_classname = "PaymentServiceProto";

service PaymentProcessingService {
  rpc ProcessPayment (ProcessPaymentRequestGrpc) returns (PaymentResponseGrpc);
}

message ProcessPaymentRequestGrpc {
  int64 order_id = 1;
  string amount = 2;
}

message PaymentResponseGrpc {
  int64 payment_id = 1;
  int64 order_id = 2;
  string status = 3;
  string amount = 4;
  string failure_reason = 5;
  string created_at = 6;
  string updated_at = 7;
}
